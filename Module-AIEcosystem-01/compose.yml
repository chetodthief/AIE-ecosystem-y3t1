services:
  redis:
    image: redis:8.8.0-alpine
    logging:                  
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: >
      redis-server
      --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    logging:                  
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin           
      POSTGRES_PASSWORD: password123 
      POSTGRES_DB: school_db         
    ports:
      - "5433:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
  
  label-studio:
    image: heartexlabs/label-studio:latest
    logging:                  
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: label_studio
    restart: unless-stopped
    ports:
      - "8085:8080" 
    depends_on:
      - postgres    
    environment:
      
      - DJANGO_DB=default
      - POSTGRE_NAME=school_db
      - POSTGRE_USER=admin
      - POSTGRE_PASSWORD=password123
      - POSTGRE_HOST=postgres_db
      - POSTGRE_PORT=5432
      
      # ตั้งค่าสร้าง User เริ่มต้นสำหรับ Login 
      - LABEL_STUDIO_USERNAME=admin@example.com
      - LABEL_STUDIO_PASSWORD=password123
    volumes:
      - label-studio-data:/label-studio/data

  minio:
    image: minio/minio:latest
    container_name: minio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  mlflow:
    build:
      context: ./backend
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - postgres
      - minio
    command: >
      mlflow server
      --backend-store-uri postgresql://admin:password123@postgres_db:5432/school_db
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - redis
      - minio
      - mlflow

  trainer_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: trainer_worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - WORKER_TYPE=trainer
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - redis
      - minio
      - mlflow
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  inference_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: inference_worker
    restart: unless-stopped
    environment:
      - WORKER_TYPE=inference
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - redis
      - minio
      - mlflow

volumes:
  redis-data:
  postgresql-data:
  label-studio-data:
  minio-data:


